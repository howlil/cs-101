name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify workbook import snapshot is deterministic
        run: pnpm run curriculum:verify-import
      - name: Verify NET-001 reproducible authoring and executable fixture
        run: |
          pnpm generation:validate NET-001
          pnpm generation:promote NET-001
          git diff --exit-code -- src/content/lessons/NET-001.mdx generation/NET-001.json review-banks/NET-001.json generation/pedagogy/NET-001.json generation/sources/NET-001.json generation/proofs/NET-001.json generation/executables/NET-001.json generation/verified/NET-001.json generation/fixtures/NET-001/request-path.mjs
      - name: Verify SPR-006 reproducible authoring and Java HTTP fixture
        run: |
          pnpm generation:validate SPR-006
          pnpm generation:promote SPR-006
          git diff --exit-code -- src/content/lessons/SPR-006.mdx generation/SPR-006.json review-banks/SPR-006.json generation/pedagogy/SPR-006.json generation/sources/SPR-006.json generation/proofs/SPR-006.json generation/executables/SPR-006.json generation/verified/SPR-006.json generation/fixtures/SPR-006/TransferContractFixture.java
      - name: Validate authored lessons and question banks
        run: pnpm validate
      - name: Unit tests
        run: pnpm test
      - name: Golden lesson end-to-end acceptance
        run: pnpm run test:golden
      - name: Astro type check
        run: pnpm check
      - name: CSS parse
        run: node scripts/validate-css.mjs
      - name: Safe Node build
        run: pnpm build:node
      - name: Single-page smoke test
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > /tmp/cs101-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ >/dev/null; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/cs101-smoke.log; exit 1; fi
          curl --fail --silent --show-error http://127.0.0.1:4321/ > /tmp/catalog-root.html
          grep -q 'Build Doctor' /tmp/catalog-root.html
          grep -q 'Outline kurikulum' /tmp/catalog-root.html
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?item=SQL-001' > /tmp/catalog-database.html
          grep -q 'SQL Workbench' /tmp/catalog-database.html
          grep -q 'Outline kurikulum' /tmp/catalog-database.html
          grep -q 'Lanjut ke project' /tmp/catalog-database.html
          if grep -q 'Lanjut ke latihan soal' /tmp/catalog-database.html; then exit 1; fi
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?item=SQL-001&view=soal' > /tmp/catalog-soal.html
          grep -q 'Soal dan pembahasan belum diterbitkan' /tmp/catalog-soal.html
          if grep -q 'Outline konsep yang akan dibahas' /tmp/catalog-soal.html; then exit 1; fi
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?item=SQL-001&view=project' > /tmp/catalog-project.html
          grep -q 'Project ini adalah ide dari workbook' /tmp/catalog-project.html
          if grep -q 'Soal dan pembahasan belum diterbitkan' /tmp/catalog-project.html; then exit 1; fi
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?item=JAV-009' > /tmp/catalog-java.html
          grep -q 'Duplicate Payment Checker' /tmp/catalog-java.html
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?mode=graph&concept=http-request-lifecycle&level=G2' > /tmp/graph-g2.html
          grep -q 'Suggested study path' /tmp/graph-g2.html
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?item=NET-001' > /tmp/net-lesson.html
          grep -q 'Mental model: boundary sebelum HTTP' /tmp/net-lesson.html
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?item=NET-001&view=soal' > /tmp/net-quiz.html
          grep -q 'Lima pertanyaan pembeda' /tmp/net-quiz.html
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?item=SPR-006&concept=http-request-lifecycle&level=G1' > /tmp/spring-lesson.html
          grep -q 'HTTP adapter' /tmp/spring-lesson.html
          grep -q 'Spring MVC — Mapping Requests' /tmp/spring-lesson.html
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?item=SPR-006&view=soal&concept=http-request-lifecycle&level=G1' > /tmp/spring-quiz.html
          grep -q 'Cek kontrak Spring MVC' /tmp/spring-quiz.html
          grep -q 'Cek jawaban' /tmp/spring-quiz.html
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?item=SPR-006&view=project&concept=http-request-lifecycle&level=G1' > /tmp/spring-project.html
          grep -q 'Transfer API — POST 201' /tmp/spring-project.html
          grep -q 'Assessment guide' /tmp/spring-project.html
          grep -q 'Step 2 of 3' /tmp/spring-project.html
          grep -q 'Next unit' /tmp/spring-project.html
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?item=NET-001&view=project&concept=http-request-lifecycle&level=G1' > /tmp/net-project.html
          grep -q 'Enam kasus dibedakan' /tmp/net-project.html
          grep -q 'Assessment guide' /tmp/net-project.html
          grep -q 'PRD-002' /tmp/graph-g2.html
          grep -q 'Assessment blueprint' /tmp/graph-g2.html
          grep -q 'Explain how a database outage' /tmp/graph-g2.html
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?item=PRD-002&view=project&concept=http-request-lifecycle&level=G2' > /tmp/rubric-project.html
          grep -q 'Assessment guide' /tmp/rubric-project.html
          grep -q 'readiness' /tmp/rubric-project.html
          if grep -q 'Assessment guide' /tmp/catalog-project.html; then exit 1; fi
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?item=NET-001&concept=http-request-lifecycle&level=G1' > /tmp/path-first.html
          grep -q 'Step 1 of 3' /tmp/path-first.html
          grep -q 'Back to concept graph' /tmp/path-first.html
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?item=NET-001&view=project&concept=http-request-lifecycle&level=G1' > /tmp/path-project.html
          grep -q 'Next unit' /tmp/path-project.html
          grep -q 'SPR-006' /tmp/path-project.html
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?mode=graph&level=G3' > /tmp/graph-g3.html
          grep -q 'No curated G3 outcomes yet' /tmp/graph-g3.html
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?track=networking' > /tmp/catalog-networking.html
          grep -q 'Request Path' /tmp/catalog-networking.html
          curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4321/api/learning | grep -q 404
          curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4321/learn/SQL-001 | grep -q 302
