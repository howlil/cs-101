name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate authored lessons and question banks
        run: pnpm validate
      - name: Unit tests
        run: pnpm test
      - name: Astro type check
        run: pnpm check
      - name: CSS parse
        run: node scripts/validate-css.mjs
      - name: Safe Node build
        run: pnpm build:node
      - name: Single-page smoke test
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > /tmp/cs101-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ >/dev/null; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/cs101-smoke.log; exit 1; fi
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?item=SQL-001' > /tmp/cs101-lesson.html
          grep -q 'data-lesson-stage="understand"' /tmp/cs101-lesson.html
          grep -q 'data-lesson-stage="practice"' /tmp/cs101-lesson.html
          grep -q 'id="ide-project"' /tmp/cs101-lesson.html
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?item=JAV-P01' > /tmp/cs101-project.html
          grep -q 'Problem statement' /tmp/cs101-project.html
          curl --fail --silent --show-error 'http://127.0.0.1:4321/?track=networking' > /tmp/cs101-domain.html
          grep -q 'NET-001' /tmp/cs101-domain.html
          curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4321/api/learning | grep -q 404
          curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4321/learn/SQL-001 | grep -q 302
