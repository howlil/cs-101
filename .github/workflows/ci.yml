name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify workbook import snapshot is deterministic
        run: pnpm run curriculum:verify-import
      - name: Verify NET-001 reproducible authoring and executable fixture
        run: |
          pnpm generation:validate NET-001
          pnpm generation:promote NET-001
          git diff --exit-code -- src/content/lessons/NET-001.mdx generation/NET-001.json review-banks/NET-001.json generation/pedagogy/NET-001.json generation/sources/NET-001.json generation/proofs/NET-001.json generation/executables/NET-001.json generation/verified/NET-001.json generation/fixtures/NET-001/request-path.mjs
      - name: Verify NET-006 reproducible authoring and TCP socket fixture
        run: |
          pnpm generation:validate NET-006
          pnpm generation:promote NET-006
          git diff --exit-code -- src/content/lessons/NET-006.mdx generation/NET-006.json review-banks/NET-006.json generation/pedagogy/NET-006.json generation/sources/NET-006.json generation/proofs/NET-006.json generation/executables/NET-006.json generation/verified/NET-006.json generation/fixtures/NET-006/tcp-lifecycle.mjs
      - name: Verify SPR-006 reproducible authoring and Java HTTP fixture
        run: |
          pnpm generation:validate SPR-006
          pnpm generation:promote SPR-006
          git diff --exit-code -- src/content/lessons/SPR-006.mdx generation/SPR-006.json review-banks/SPR-006.json generation/pedagogy/SPR-006.json generation/sources/SPR-006.json generation/proofs/SPR-006.json generation/executables/SPR-006.json generation/verified/SPR-006.json generation/fixtures/SPR-006/TransferContractFixture.java
      - name: Verify OSX-029 reproducible authoring and Linux bind fixture
        run: |
          pnpm generation:validate OSX-029
          pnpm generation:promote OSX-029
          git diff --exit-code -- src/content/lessons/OSX-029.mdx generation/OSX-029.json review-banks/OSX-029.json generation/pedagogy/OSX-029.json generation/sources/OSX-029.json generation/proofs/OSX-029.json generation/executables/OSX-029.json generation/verified/OSX-029.json generation/fixtures/OSX-029/binding-mystery.mjs
      - name: Verify PRD-002 reproducible authoring and HTTP health fixture
        run: |
          pnpm generation:validate PRD-002
          pnpm generation:promote PRD-002
          git diff --exit-code -- src/content/lessons/PRD-002.mdx generation/PRD-002.json review-banks/PRD-002.json generation/pedagogy/PRD-002.json generation/sources/PRD-002.json generation/proofs/PRD-002.json generation/executables/PRD-002.json generation/verified/PRD-002.json generation/fixtures/PRD-002/health-contract.mjs
      - name: Verify JAV-001 reproducible authoring and Java 21 build fixture
        run: |
          pnpm generation:validate JAV-001
          pnpm generation:promote JAV-001
          git diff --exit-code -- src/content/lessons/JAV-001.mdx generation/JAV-001.json review-banks/JAV-001.json generation/pedagogy/JAV-001.json generation/sources/JAV-001.json generation/proofs/JAV-001.json generation/executables/JAV-001.json generation/verified/JAV-001.json generation/fixtures/JAV-001/BuildDoctorFixture.java
      - name: Verify SQL-001 reproducible authoring (SQL runtime external)
        run: |
          pnpm generation:validate SQL-001
          pnpm generation:promote SQL-001
          git diff --exit-code -- src/content/lessons/SQL-001.mdx generation/SQL-001.json review-banks/SQL-001.json generation/pedagogy/SQL-001.json generation/sources/SQL-001.json generation/proofs/SQL-001.json generation/executables/SQL-001.json generation/verified/SQL-001.json
      - name: SQL-001 PostgreSQL 16 integration — no public port
        run: bash labs/SQL-001/verify-postgres.sh
      - name: Verify TST-007 reproducible authoring (JUnit runtime external)
        run: |
          pnpm generation:validate TST-007
          pnpm generation:promote TST-007
          git diff --exit-code -- src/content/lessons/TST-007.mdx generation/TST-007.json review-banks/TST-007.json generation/pedagogy/TST-007.json generation/sources/TST-007.json generation/proofs/TST-007.json generation/executables/TST-007.json generation/verified/TST-007.json
      - name: TST-007 JUnit Jupiter 5 / Maven Surefire verification
        run: |
          mvn -B -ntp -f labs/TST-007/pom.xml clean verify
          python3 labs/TST-007/verify-surefire.py
      - name: Verify SYS-008 reproducible authoring and static OpenAPI contract
        run: |
          pnpm generation:validate SYS-008
          pnpm generation:promote SYS-008
          git diff --exit-code -- src/content/lessons/SYS-008.mdx generation/SYS-008.json review-banks/SYS-008.json generation/pedagogy/SYS-008.json generation/sources/SYS-008.json generation/proofs/SYS-008.json generation/executables/SYS-008.json generation/verified/SYS-008.json generation/fixtures/SYS-008/contract-review.mjs
      - name: TST-019 real HTTP contract test against local educational stub
        run: node labs/TST-019/http-contract.mjs
      - name: Verify TST-019 reproducible V3 authoring and HTTP fixture
        run: |
          pnpm generation:validate TST-019
          pnpm generation:promote TST-019
          git diff --exit-code -- src/content/lessons/TST-019.mdx generation/TST-019.json review-banks/TST-019.json generation/pedagogy/TST-019.json generation/sources/TST-019.json generation/proofs/TST-019.json generation/executables/TST-019.json generation/verified/TST-019.json generation/fixtures/TST-019/http-contract.mjs
      - name: Verify TST-020 reproducible V3 and contract drift fixture
        run: |
          pnpm generation:validate TST-020
          pnpm generation:promote TST-020
          git diff --exit-code -- src/content/lessons/TST-020.mdx generation/TST-020.json review-banks/TST-020.json generation/pedagogy/TST-020.json generation/sources/TST-020.json generation/proofs/TST-020.json generation/executables/TST-020.json generation/verified/TST-020.json generation/fixtures/TST-020/contract-drift.mjs
      - name: Verify TST-021 reproducible V3 authoring (Pact runtime external)
        run: |
          pnpm generation:validate TST-021
          pnpm generation:promote TST-021
          git diff --exit-code -- src/content/lessons/TST-021.mdx generation/TST-021.json review-banks/TST-021.json generation/pedagogy/TST-021.json generation/sources/TST-021.json generation/proofs/TST-021.json generation/executables/TST-021.json generation/verified/TST-021.json
      - name: TST-021 real Pact JS consumer and provider verification
        env:
          SCARF_ANALYTICS: 'false'
        run: |
          set -euo pipefail
          npm install --prefix labs/TST-021 --no-audit --no-fund --package-lock=false
          node labs/TST-021/pact-contract.mjs | tee /tmp/tst-021-pact.log
          grep -q 'consumer-pact=generated-two-interactions' /tmp/tst-021-pact.log
          grep -q 'healthy-provider=pact-verified' /tmp/tst-021-pact.log
          grep -q 'numeric-amount-provider=pact-verifier-rejected' /tmp/tst-021-pact.log
      - name: Verify TST-022 reproducible V3 and HTTP provider fault fixture
        run: |
          pnpm generation:validate TST-022
          pnpm generation:promote TST-022
          git diff --exit-code -- src/content/lessons/TST-022.mdx generation/TST-022.json review-banks/TST-022.json generation/pedagogy/TST-022.json generation/sources/TST-022.json generation/proofs/TST-022.json generation/executables/TST-022.json generation/verified/TST-022.json generation/fixtures/TST-022/provider-fault-matrix.mjs
