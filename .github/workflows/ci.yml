name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Astro check
        run: pnpm check

      - name: Safe Node build
        run: pnpm build:node

      - name: Smoke Node runtime
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > /tmp/cs101-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ >/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/cs101-smoke.log
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:4321/ >/dev/null
          curl --fail --silent http://127.0.0.1:4321/curriculum >/dev/null
          curl --fail --silent http://127.0.0.1:4321/progress >/dev/null
          curl --fail --silent http://127.0.0.1:4321/learn/SQL-001 > /tmp/cs101-sql001.html
          grep -q 'data-lesson-stage="understand"' /tmp/cs101-sql001.html
          grep -q 'data-lesson-stage="practice"' /tmp/cs101-sql001.html
          grep -q 'data-lesson-stage="evidence"' /tmp/cs101-sql001.html
          for id in JAV-001 SQL-002 JAV-002; do
            curl --fail --silent --show-error "http://127.0.0.1:4321/learn/$id" > "/tmp/cs101-$id.html"
            grep -q 'data-lesson-stage="understand"' "/tmp/cs101-$id.html"
            grep -q 'data-lesson-stage="practice"' "/tmp/cs101-$id.html"
            grep -q 'data-lesson-stage="evidence"' "/tmp/cs101-$id.html"
          done

          for page in project/JAV-P01 integration/INT-001 review/SQL-001; do
            curl --fail --silent --show-error "http://127.0.0.1:4321/$page" >/dev/null
          done
          node scripts/browser-qa.mjs



      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs101-responsive-qa
          path: /tmp/cs101-qa/*.png
          if-no-files-found: ignore
          retention-days: 14
