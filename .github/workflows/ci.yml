        run: |
          pnpm generation:validate TST-024
          pnpm generation:promote TST-024
          git diff --exit-code -- src/content/lessons/TST-024.mdx generation/TST-024.json review-banks/TST-024.json generation/pedagogy/TST-024.json generation/sources/TST-024.json generation/proofs/TST-024.json generation/executables/TST-024.json generation/verified/TST-024.json
      - name: TST-024 real HTTP service and PostgreSQL 16 internal integration
        run: |
          set -euo pipefail
          bash labs/TST-024/verify.sh | tee /tmp/tst024-integration.log
          grep -qx 'service-boundary-network=internal' /tmp/tst024-integration.log
          grep -qx 'transfer-success=persisted-accepted' /tmp/tst024-integration.log
          grep -qx 'transfer-timeout=persisted-unknown' /tmp/tst024-integration.log
          grep -qx 'bank-requests=2' /tmp/tst024-integration.log
          grep -qx 'published-ports=0' /tmp/tst024-integration.log
          grep -qx 'production-bank-requests=0' /tmp/tst024-integration.log
          grep -qx 'tst024-postgres16=verified' /tmp/tst024-integration.log
      - name: Verify TST-025 reproducible V3 and high-value journey selection audit
        run: |
          pnpm generation:validate TST-025
          pnpm generation:promote TST-025
          git diff --exit-code -- src/content/lessons/TST-025.mdx generation/TST-025.json review-banks/TST-025.json generation/pedagogy/TST-025.json generation/sources/TST-025.json generation/proofs/TST-025.json generation/executables/TST-025.json generation/verified/TST-025.json generation/fixtures/TST-025/journey-selection.mjs
