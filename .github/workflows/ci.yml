        run: pnpm validate
      - name: Unit tests
        run: pnpm test
      - name: Golden lesson end-to-end acceptance
        run: pnpm run test:golden
      - name: Astro type check
        run: pnpm check
      - name: CSS parse
        run: node scripts/validate-css.mjs
      - name: Safe Node build
        run: pnpm build:node
      - name: Single-page smoke test
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > /tmp/cs101-smoke.log 2>&1 &
          pid=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "SMOKE FAILURE: server log"; tail -n 100 /tmp/cs101-smoke.log; fi; kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ >/dev/null; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/cs101-smoke.log; exit 1; fi
          curl --fail --silent --show-error http://127.0.0.1:4321/ > /tmp/catalog-root.html
          grep -q 'Build Doctor' /tmp/catalog-root.html
          grep -q 'Compile, build, dan launch' /tmp/catalog-root.html
          grep -q 'Maven dependency mechanism' /tmp/catalog-root.html
